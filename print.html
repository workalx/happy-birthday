<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слово на кожен настрій</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨 Роздрукувати / зберегти PDF</button>
    <a href="index.html">← До мультика</a>
  </div>

  <article class="sheet">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <header>
      <div class="cross">✝</div>
      <h1>Слово на кожен настрій</h1>
      <p class="lead">Подарунок до дня народження — від твоїх друзів</p>
      <div class="divider"><span>✦</span></div>
    </header>
    <section id="list" class="grid"></section>
    <footer>
      <div class="divider"><span>✦</span></div>
      <p class="sign">З любов'ю, твої друзі 💛</p>
      <p class="small">Біблія в перекладі Івана Огієнка</p>
    </footer>
  </article>

  <script src="js/verses.js"></script>
  <script>
    document.getElementById('list').innerHTML = VERSES.map(v => `
      <div class="item">
        <h2>${v.mood}</h2>
        <p class="verse">«${v.text}»</p>
        <p class="ref">${v.ref}</p>
      </div>`).join('');
    if (new URLSearchParams(location.search).has('auto')) addEventListener('load', () => setTimeout(print, 600));
  </script>
</body>
</html>
